name: Update submodules

on:
  repository_dispatch:
    types: [submodule-updated]   # sent by notify-parent.yml in the submodule repos
  schedule:
    - cron: "0 3 * * *"          # backup: once a day at 03:00 UTC
  workflow_dispatch:             # manual run from the Actions tab

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # The workflow now runs inside Sengine, so no "repository:" is needed.
      # The token is still needed so it can fetch private submodules and push.
      - name: Checkout Sengine
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.SENGINE_AUTO_UPDATE }}
          submodules: recursive
          fetch-depth: 0

      # --remote follows the "branch =" set for each submodule in .gitmodules.
      # If no branch is set, it follows that submodule's default branch.
      # Make sure this matches the branch you actually push to in the submodule.
      - name: Update submodules to latest remote commits
        run: git submodule update --init --recursive --remote

      # Shows which branch each submodule tracks and which commit it landed on.
      # Check this step's output in the Actions log if nothing gets updated.
      - name: Show submodule state
        run: |
          echo "---- .gitmodules ----"
          cat .gitmodules
          echo "---- submodule status ----"
          git submodule status --recursive
          echo "---- git status ----"
          git status

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No submodule changes to commit"
          else
            git commit -m "Update submodules"
            git push
          fi
